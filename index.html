<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Länkpollare</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --ok: #15803d;
      --warn: #b45309;
      --err: #b91c1c;
      --border: #e5e7eb;
      --accent: #0f766e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 10% 10%, #e6fffa 0%, var(--bg) 45%);
      color: var(--text);
      padding: 12px 16px;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 1.3rem;
    }

    p {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.4;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
      color: var(--text);
    }

    .toggle input {
      margin: 0;
    }

    .hidden {
      display: none !important;
    }

    .overall {
      margin: 0 0 10px;
      padding: 8px 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      border: 1px solid var(--border);
      background: #f8fafc;
    }

    .overall-available {
      color: var(--ok);
      border-color: #86efac;
      background: #f0fdf4;
    }

    .overall-unavailable {
      color: #334155;
    }

    button {
      border: 0;
      background: var(--accent);
      color: #fff;
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { filter: brightness(0.95); }

    .small {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .list {
      display: grid;
      gap: 6px;
    }

    .item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
    }

    .url {
      color: #0f172a;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }

    .link-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      overflow: hidden;
    }

    .signal {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stop-sign {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      background: #dc2626;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .stop-sign::before {
      content: "";
      width: 12px;
      height: 3px;
      border-radius: 2px;
      background: #fff;
    }

    .signal-ok {
      color: var(--ok);
      font-weight: 600;
    }

    .signal-available {
      color: var(--ok);
      font-weight: 700;
    }

    .available-icon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      border-radius: 999px;
      background: #16a34a;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 800;
      line-height: 1;
    }

    .signal-stop {
      color: var(--err);
    }

    .status-ok { color: var(--ok); }
    .status-warn { color: var(--warn); }
    .status-err { color: var(--err); }
  </style>
</head>
<body>
  <main class="container">
    <h1>USM-biljetter</h1>
    <p>Pollar automatiskt var 30:e sekund.</p>

    <div class="controls">
      <button id="refreshBtn" type="button">Uppdatera nu</button>
      <button id="testAlertBtn" type="button">Testa larm</button>
      <label id="soundToggleWrap" class="toggle" for="soundToggle">
        <input id="soundToggle" type="checkbox">
        Ljudsignal
      </label>
      <span id="lastRun" class="small">Inte kontrollerad ännu</span>
    </div>

    <p id="overall" class="overall overall-unavailable">Kontrollerar tillgänglighet...</p>

    <section id="list" class="list"></section>
  </main>

  <script>
    const links = [
      "https://junesim.se/products/ungdoms-sm-i-simning-50m",
      "http://junesim.se/products/ungdoms-sm-i-simning-dag-1-15-juli",
      "http://junesim.se/products/ungdoms-sm-i-simning-dag-2-16-juli",
      "https://junesim.se/products/copy-of-ungdoms-sm-i-simning-dag-3-17-juli",
      "https://junesim.se/products/ungdoms-sm-i-simning-dag-4-18-juli",
      "https://junesim.se/products/ungdoms-sm-i-simning-dag-5-19-juli"
    ];

    const pollIntervalMs = 30_000;
    const requestTimeoutMs = 10_000;
    const listEl = document.getElementById("list");
    const lastRunEl = document.getElementById("lastRun");
    const refreshBtn = document.getElementById("refreshBtn");
    const testAlertBtn = document.getElementById("testAlertBtn");
    const soundToggleWrapEl = document.getElementById("soundToggleWrap");
    const soundToggleEl = document.getElementById("soundToggle");
    const overallEl = document.getElementById("overall");
    const baseTitle = document.title;
    const alertsFeatureFlag = false;
    const alertsParam = (new URLSearchParams(window.location.search).get("alerts") || "").toLowerCase();
    const alertsEnabled = alertsFeatureFlag || alertsParam === "1" || alertsParam === "true" || alertsParam === "on";
    const suppressedAlertSlugs = new Set([
      "ungdoms-sm-i-simning-dag-2-16-juli"
    ]);

    let hasAnnouncedAvailable = false;
  let currentAlertCount = 0;
    let titleBlinkIntervalId = null;
    let audioContext = null;

    function createFaviconDataUrl(isAlert, count = 0) {
      const canvas = document.createElement("canvas");
      canvas.width = 64;
      canvas.height = 64;
      const ctx = canvas.getContext("2d");
      if (!ctx) {
        return "";
      }

      ctx.fillStyle = isAlert ? "#b91c1c" : "#0f766e";
      ctx.beginPath();
      ctx.arc(32, 32, 28, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.font = "700 34px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      const badgeText = isAlert
        ? (count > 9 ? "9+" : String(Math.max(count || 1, 1)))
        : "U";
      ctx.fillText(badgeText, 32, 34);

      return canvas.toDataURL("image/png");
    }

    function setFavicon(href) {
      if (!href) {
        return;
      }

      let iconEl = document.querySelector("link[rel='icon']");
      if (!iconEl) {
        iconEl = document.createElement("link");
        iconEl.rel = "icon";
        document.head.appendChild(iconEl);
      }
      iconEl.href = href;
    }

    const normalFavicon = createFaviconDataUrl(false);
    const alertFaviconCache = new Map();

    function getAlertFavicon(count) {
      const key = count > 9 ? "9+" : String(Math.max(count, 1));
      if (!alertFaviconCache.has(key)) {
        const numericCount = key === "9+" ? 10 : Number(key);
        alertFaviconCache.set(key, createFaviconDataUrl(true, numericCount));
      }
      return alertFaviconCache.get(key);
    }

    function alertTitle(count) {
      const countText = count > 9 ? "9+" : String(Math.max(count, 1));
      return `(${countText}) BILJETTER NU!`;
    }

    function applyTabAlertState() {
      if (currentAlertCount <= 0) {
        document.title = baseTitle;
        setFavicon(normalFavicon);
        return;
      }

      document.title = alertTitle(currentAlertCount);
      setFavicon(getAlertFavicon(currentAlertCount));
    }

    function updateAlertControls() {
      if (!alertsEnabled) {
        testAlertBtn.classList.add("hidden");
        soundToggleWrapEl.classList.add("hidden");
        soundToggleEl.checked = false;
        soundToggleEl.disabled = true;
        hasAnnouncedAvailable = false;
        currentAlertCount = 0;
        stopTitleBlink();
        return;
      }

      testAlertBtn.classList.remove("hidden");
      soundToggleWrapEl.classList.remove("hidden");
    }

    function startTitleBlink(count = 1) {
      if (titleBlinkIntervalId) {
        return;
      }

      let flipped = false;
      titleBlinkIntervalId = setInterval(() => {
        if (flipped) {
          document.title = alertTitle(count);
          setFavicon(getAlertFavicon(count));
        } else {
          document.title = `● ${baseTitle}`;
          setFavicon(normalFavicon);
        }
        flipped = !flipped;
      }, 900);
    }

    function stopTitleBlink() {
      if (!titleBlinkIntervalId) {
        applyTabAlertState();
        return;
      }

      clearInterval(titleBlinkIntervalId);
      titleBlinkIntervalId = null;
      applyTabAlertState();
    }

    function ensureAudioContext() {
      if (!audioContext) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) {
          return null;
        }
        audioContext = new AudioContextClass();
      }

      if (audioContext.state === "suspended") {
        audioContext.resume().catch(() => {});
      }

      return audioContext;
    }

    function playAlertSound() {
      if (!soundToggleEl.checked) {
        return;
      }

      const ctx = ensureAudioContext();
      if (!ctx) {
        return;
      }

      const now = ctx.currentTime;
      const oscillator = ctx.createOscillator();
      const gain = ctx.createGain();
      oscillator.type = "sine";
      oscillator.frequency.setValueAtTime(920, now);
      oscillator.frequency.setValueAtTime(740, now + 0.2);
      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(0.12, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.42);
      oscillator.connect(gain);
      gain.connect(ctx.destination);
      oscillator.start(now);
      oscillator.stop(now + 0.45);
    }

    function triggerAlerts(items) {
      if (!alertsEnabled) {
        hasAnnouncedAvailable = false;
        currentAlertCount = 0;
        stopTitleBlink();
        return;
      }

      const availableCount = items.filter((item) => item.addToCart && !suppressedAlertSlugs.has(item.slug)).length;
      if (availableCount === 0) {
        hasAnnouncedAvailable = false;
        currentAlertCount = 0;
        stopTitleBlink();
        return;
      }

      const shouldPlaySound = !hasAnnouncedAvailable;
      hasAnnouncedAvailable = true;
      currentAlertCount = availableCount;
      if (document.hidden) {
        if (titleBlinkIntervalId) {
          stopTitleBlink();
        }
        startTitleBlink(availableCount);
      } else {
        stopTitleBlink();
      }

      if (shouldPlaySound) {
        playAlertSound();
      }
    }

    function render(items) {
      listEl.innerHTML = "";
      const anyAvailable = items.some((item) => item.addToCart);
      overallEl.textContent = anyAvailable
        ? "Biljetter finns till salu nu"
        : "Inga biljetter till salu just nu";
      overallEl.className = `overall ${anyAvailable ? "overall-available" : "overall-unavailable"}`;

      items.forEach((item) => {
        const article = document.createElement("article");
        article.className = "item";

        article.innerHTML = `
          <div class="link-row">
            <a class="url" href="${item.url}" target="_blank" rel="noreferrer" title="${item.url}">${item.label}</a>
            ${item.outOfStock
              ? '<div class="signal signal-stop" title="OUT OF STOCK"><span class="stop-sign" aria-hidden="true"></span></div>'
              : item.addToCart
                ? '<div class="signal signal-available" title="Biljetter till salu"><span class="available-icon" aria-hidden="true">\u2713</span></div>'
                : '<div class="signal signal-ok" title="Ingen tillgänglighet hittad"><span class="small">-</span></div>'}
          </div>
        `;

        listEl.appendChild(article);
      });
    }

    function cleanText(input) {
      return input.replace(/\s+/g, " ").trim();
    }

    function containsOutOfStock(text) {
      return /(OUT OF STOCK|SOLD OUT|SLUTSÅLD)/i.test(text);
    }

    function containsAddToCart(text) {
      return /(ADD TO CART|LAGG I KUNDVAGN|L\xC4GG I KUNDVAGN)/i.test(text);
    }

    async function fetchWithTimeout(url) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), requestTimeoutMs);

      try {
        const response = await fetch(url, {
          method: "GET",
          cache: "no-store",
          signal: controller.signal
        });
        return response;
      } finally {
        clearTimeout(timeoutId);
      }
    }

    async function fetchPageText(url) {
      const normalizedUrl = url.replace(/^http:\/\//i, "https://");
      const noScheme = normalizedUrl.replace(/^https?:\/\//, "");
      const proxyCandidates = [
        `https://r.jina.ai/http://${noScheme}`,
        `https://r.jina.ai/http://https://${noScheme}`,
        `https://r.jina.ai/http://${url.replace(/^https?:\/\//, "")}`
      ];

      let lastError = null;

      for (const proxyUrl of proxyCandidates) {
        try {
          const proxyResponse = await fetchWithTimeout(proxyUrl);
          if (!proxyResponse.ok) {
            lastError = new Error(`Proxyfel ${proxyResponse.status}`);
            continue;
          }

          const proxyText = await proxyResponse.text();
          const cleaned = cleanText(proxyText);
          if (!cleaned) {
            lastError = new Error("Tomt proxysvar");
            continue;
          }

          return {
            via: "proxy",
            text: cleaned
          };
        } catch (error) {
          lastError = error;
        }
      }

      if (lastError && lastError.name === "AbortError") {
        throw new Error("Timeout vid hämtning");
      }

      throw lastError || new Error("Kunde inte hämta via proxy");
    }

    async function checkUrl(url) {
      const checkedAt = new Date().toLocaleString("sv-SE");
      const slug = url.split("/products/")[1] || url;
      const label = slug.replace(/-/g, " ").replace(/^copy of /i, "").trim();

      try {
        const content = await fetchPageText(url);
        const outOfStock = containsOutOfStock(content.text);
        const addToCart = containsAddToCart(content.text);

        return {
          url,
          slug,
          label,
          checkedAt,
          statusText: `OK (${content.via})`,
          outOfStock,
          addToCart
        };
      } catch (error) {
        return {
          url,
          slug,
          label,
          checkedAt,
          statusText: `Kunde inte läsa svar (${error.message})`,
          outOfStock: false,
          addToCart: false
        };
      }
    }

    async function runPoll() {
      refreshBtn.disabled = true;
      const results = await Promise.all(links.map((url) => checkUrl(url)));
      render(results);
      triggerAlerts(results);
      lastRunEl.textContent = `Senaste poll: ${new Date().toLocaleString("sv-SE")}`;
      refreshBtn.disabled = false;
    }

    refreshBtn.addEventListener("click", runPoll);
    testAlertBtn.addEventListener("click", () => {
      currentAlertCount = 1;
      if (document.hidden) {
        startTitleBlink(1);
      } else {
        applyTabAlertState();
      }
      playAlertSound();
    });

    document.addEventListener("click", () => {
      ensureAudioContext();
    });

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        stopTitleBlink();
      } else if (currentAlertCount > 0) {
        startTitleBlink(currentAlertCount);
      }
    });

    updateAlertControls();
    applyTabAlertState();

    runPoll();
    setInterval(runPoll, pollIntervalMs);
  </script>
</body>
</html>
